# datos.gob.ar — Time Series API + the `sspm` catalog. Prices, activity, wages, consumption.
# One API for 31,000+ series from INDEC and other agencies. Maximum limit 1000.
# `series` requests one series at a time from the API; `sspm` downloads the full history from the
# catalog's CSV distributions (one download per file). Ids verified live 2026-11-16.

source: datos_gob_ar
base_url: https://apis.datos.gob.ar
description: Time Series API of the Argentine government. No auth. {data[[date,value]], count, meta}.
rate_limit_per_second: 4
timeout_seconds: 30
max_retries: 3
license: "CC BY 4.0"
attribution: "Source: INDEC / SSPM, via datos.gob.ar"
terms_url: https://datos.gob.ar/

datasets:
  series:
    shape: series
    publish: true
    path: /series/api/series/
    pagination: start_count
    page_limit: 1000
    provenance: official
    declared_freshness: monthly (depends on the series; the API declares `frequency`)
    revision_policy: INDEC revises foreign trade and activity backwards; the API does not flag it
    expected_schema:
      series_id: str
      variable: str
      date: date
      value: number
    options:
      # API id → variable name in the Parquet output
      ids:
        148.3_INIVELNAL_DICI_M_26: cpi_national_headline
        103.1_I2N_2016_M_15: cpi_gba_core
        74.3_IET_0_M_16: exports_total_musd
        75.3_IETPP_0_M_43: exports_primary_products_musd
        75.3_ITM_0_M_13: exports_industrial_manufactures_musd
    description: |
      Monthly INDEC series republished by datos.gob.ar. Per-variable descriptions come from the
      API itself (metadata=full) and are appended below.

  sspm:
    shape: series
    publish: true
    path: /series/api/series/
    provenance: official
    declared_freshness: depends on the series (mostly monthly; usd_bna_selling_rate is daily)
    revision_policy: INDEC revises activity and consumption backwards; flagged in revision_of
    expected_schema:
      series_id: str
      variable: str
      date: str
      value: number
    options:
      kind: sspm
      # API id → [variable in the Parquet output, topic group]
