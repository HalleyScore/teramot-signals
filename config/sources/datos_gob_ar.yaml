      RIPTE, supermarkets, shopping centers, BNA exchange rate). One row per (variable, date).
      Units and original source per variable below and in `sspm_catalog`. License CC BY 4.0.

  sspm_catalog:
    shape: table
    publish: true
    path: /series/api/series/
    natural_key: [series_id]
    provenance: official
    declared_freshness: changes when a new data point is published (end_date)
    revision_policy: catalog metadata; titles or distributions may change
    expected_schema:
      series_id: str
      variable: str
      group: str
      title: str
      description: str
      unit: str
      frequency: str
      start_date: date
      end_date: date
      dataset_title: str
      source: str
      publisher: str
      license: str
      distribution_url: str
    options:
      kind: sspm_catalog
      series: *sspm_series
    description: |
      Metadata for the `sspm` series: topic group, the agency's title and description (Spanish),
      unit, frequency (ISO 8601), first and last date, dataset, primary source, license and
      source CSV.
