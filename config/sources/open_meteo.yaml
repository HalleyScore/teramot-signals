  observed:
    shape: table
    path: https://archive-api.open-meteo.com/v1/archive
    natural_key: [locality_id, date]
    lookback_days: 10
    provenance: third_party
    declared_freshness: daily, ~5 days behind (ERA5 reanalysis)
    revision_policy: preliminary ERA5T is replaced by final ERA5 after ~2-3 months
    expected_schema:
      locality_id: str
      locality: str
      province: str
      lat: number
      lon: number
      date: date
      temp_max: number
      temp_min: number
      temp_mean: number
      precipitation_mm: number
    options:
      kind: observed
      localities: *localities
    description: |
      Observed daily weather per locality (ERA5 reanalysis): maximum, minimum and mean temperature (°C)
      and precipitation (mm). History back to 1940 with `--since`; the daily run requests the last 10 days.
