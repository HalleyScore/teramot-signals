# Open-Meteo — daily weather per locality. Provenance: THIRD PARTY.
# Data CC BY 4.0 (attribution: Open-Meteo.com, ERA5/Copernicus and the national models).
# The free API is for NON-COMMERCIAL use only (open-meteo.com/en/terms); commercial use needs a
# paid plan or a self-hosted instance (the server is AGPL). Verified live 2026-11-16.
# The 74 localities are Georef centroids (provincial capitals and large urban areas).

source: open_meteo
base_url: https://api.open-meteo.com
description: Daily weather per coordinate. No auth. Several coordinates per request.
rate_limit_per_second: 1
timeout_seconds: 60
max_retries: 3

datasets:
  forecast:
    shape: table
    path: /v1/forecast
    natural_key: [locality_id, date]
    provenance: third_party
    declared_freshness: hourly; one run is kept per day (extraction_date = run date)
    revision_policy: each run replaces the forecast; differences between runs are recorded as revisions
    expected_schema:
      locality_id: str
      locality: str
      province: str
      lat: number
      lon: number
      date: date
      temp_max: number
      temp_min: number
      temp_mean: number
      precipitation_mm: number
