[project]
name = "teramot-signals"
version = "0.2.0"
description = "Argentine public data (BCRA, INDEC, datos.gob.ar, Georef, Open-Meteo, Energía) → immutable Parquet with a quality contract, plus a DuckDB catalog."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "teramot-signals contributors" }]
keywords = ["argentina", "open-data", "public-data", "bcra", "indec", "parquet", "duckdb", "data-ingestion"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "fsspec>=2024.6.0",
    "fastexcel>=0.11",
    "duckdb>=1.1",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6.0"]
gcs = ["gcsfs>=2024.6.0"]

[project.urls]
Repository = "https://github.com/HalleyScore/teramot-signals"

[project.scripts]
teramot-signals = "teramot_signals.core.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "basedpyright>=1.18",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teramot_signals"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
